# agendamento-service — configuracao de runtime.
# Sprint 0: o servico sobe vazio e responde em /actuator/health.
# Valores sensiveis e enderecos vem do ambiente; os defaults servem para rodar fora do Compose.
spring:
  application:
    name: agendamento-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/agendamento}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      # O schema pertence ao Flyway (Principio IV da constituicao): o Hibernate so confere.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  graphql:
    graphiql:
      # Liberado so no perfil local; a entrega nao expoe GraphiQL em producao.
      enabled: ${SPRING_GRAPHQL_GRAPHIQL_ENABLED:true}
    schema:
      locations: classpath:graphql/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    rabbit:
      enabled: true

logging:
  pattern:
    # consultaId e eventId no MDC: exigencia do Principio VII (rastrear um evento pelos 3 servicos).
    level: "%5p [consultaId=%X{consultaId:-} eventId=%X{eventId:-}]"
