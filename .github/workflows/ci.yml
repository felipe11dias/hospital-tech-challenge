# Integracao continua: `mvn verify` a cada push e a cada pull request.
#
# O Principio II da constituicao exige `mvn verify` verde como condicao de pronto. Rodar isso
# aqui transforma a exigencia em porta automatica, e nao em disciplina individual.
# O runner do GitHub tem Docker, o que permite os testes com Testcontainers (Sprints 3 e 4).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verificar o build completo
        run: ./mvnw -B -ntp verify

      - name: Conferir que nenhum segredo foi versionado
        # Principio III: chave privada nunca entra no repositorio.
        # A verificacao roda sobre os arquivos RASTREADOS, nao sobre o diretorio de trabalho.
        run: |
          set -u
          if git ls-files | grep -E '\.(pem|key|p12|jks|p8)$' ; then
            echo "::error::Arquivo de chave versionado."
            exit 1
          fi

          # Markdown fica de fora de proposito: README, ADR-002 e o relatorio da Sprint 0 citam o
          # cabecalho PEM para explicar o formato PKCS#8 exigido pelo decoder do JWT. Citar o
          # cabecalho nao e vazar chave, e sem esta excecao a propria documentacao reprovaria o build.
          achados=$(git grep -nI -E -e '-----BEGIN (RSA |EC )?PRIVATE KEY-----' -- . \
                      | grep -v -E '\.md:' || true)
          if [ -n "$achados" ]; then
            echo "$achados"
            echo "::error::Cabecalho de chave privada encontrado em arquivo versionado."
            exit 1
          fi

          echo "Nenhum segredo versionado."

      - name: Publicar relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: ignore
          retention-days: 7
